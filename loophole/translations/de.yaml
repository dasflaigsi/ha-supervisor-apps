configuration:
  port:
    name: Port
    description: Der HTTP-Port, auf dem Ihr Home Assistant läuft (normalerweise 8123). Verwenden Sie nicht den HTTPS-Port (443).
  hostname:
    name: Hostname
    description: Benutzerdefinierter Hostname für Ihren Tunnel. Die Tunnel-URL wird sein https://<hostname>.loophole.site 
  connectivity_check_interval:
    name: Intervall der Verbindungskontrolle
    description: Anzahl der Minuten zwischen den Prüfungen der öffentlichen Tunnelverbindung. Standardmäßig 15 Minuten.
  verbose:
    name: Ausführliches Logging
    description: Aktivieren Sie Debug-Logging von Loophole CLI, um detaillierte Tunnel-Operationen zu sehen
  logout_on_restart:
    name: Abmeldung beim nächsten Neustart ausführen
    description: Wenn aktiviert, meldet sich die App beim nächsten Neustart vom Loophole-Konto ab und deaktiviert diese Option dann. Dies erzwingt eine neue Anmeldung beim nächsten Neustart.
