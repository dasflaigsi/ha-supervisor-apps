configuration:
  port:
    name: Puerto HTTP local
    description: El puerto HTTP en el que se ejecuta tu Home Assistant (típicamente 8123). No utilices el puerto HTTPS (443).
  hostname:
    name: Nombre de host del túnel
    description: Nombre de host personalizado para tu túnel. La URL del túnel será https://<hostname>.loophole.site
  connectivity_check_interval:
    name: Intervalo de comprobación de conectividad
    description: Número de minutos entre las comprobaciones de la conexión del túnel público. El valor predeterminado es de 15 minutos.
  verbose:
    name: Registro detallado
    description: Habilita el registro de depuración de Loophole CLI para ver los detalles de la operación del túnel
  logout_on_restart:
    name: Ejecutar cierre de sesión en el próximo reinicio
    description: Cuando está habilitado, la app cerrará la sesión de la cuenta de Loophole en el próximo reinicio y luego deshabilitará esta opción. Esto fuerza un nuevo inicio de sesión en el siguiente reinicio.
