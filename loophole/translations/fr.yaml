configuration:
  port:
    name: Port HTTP local
    description: Le port HTTP sur lequel s'exécute votre Home Assistant (généralement 8123). N'utilisez pas le port HTTPS (443).
  hostname:
    name: Nom d'hôte du tunnel
    description: Nom d'hôte personnalisé pour votre tunnel. L'URL du tunnel sera https://<hostname>.loophole.site
  verbose:
    name: Journalisation détaillée
    description: Activez la journalisation de débogage de Loophole CLI pour voir les opérations du tunnel en détail
  logout_on_restart:
    name: Exécuter la déconnexion au prochain redémarrage
    description: Lorsque activé, l'application se déconnectera du compte Loophole au prochain redémarrage, puis désactivera cette option. Cela force une nouvelle connexion au redémarrage suivant.
  connectivity_check_interval:
    name: Intervalle de vérification de la connectivité
    description: Nombre de minutes entre les vérifications de la connexion du tunnel public. La valeur par défaut est de 15 minutes.
